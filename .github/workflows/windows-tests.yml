name: Windows Tests
on:
  push:
    branches: [main, dev, stable]
  pull_request:
  workflow_dispatch:

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [eph-win-x64, eph-win-arm64]
    runs-on: ${{ matrix.runner }}
    env:
      REPRO_TOOL_PROVISIONING: tarball
    steps:
      - uses: actions/checkout@v5

      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env (reprobuild)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@51929b6545e94d47f46afecbd6c9f38c990cc21f
        with:
          env-flavor: reprobuild
          sibling-strategy: repro-lock
          repro-version: v0.2.17
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Verify the declared Cap'n Proto executable
        shell: bash
        run: dev-exec capnp --version

      - name: Preserve declared provisioning identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-provisioning-identities-${{ matrix.runner }}
          path: |
            .repro/dev-env/**/*tool-identities.inspect.json
            .repro/build/**/*tool-identities.inspect.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      # Two crates are excluded on Windows:
      #
      # * codetracer_trace_writer_nim: links against libcodetracer_trace_writer.a
      #   built from the codetracer-trace-format-nim sibling, which needs nim +
      #   libzstd; recorder repos that need the Nim writer build it themselves.
      #
      # * codetracer_ctfs: integration tests use mock HTTP servers on 127.0.0.1
      #   (Windows often aborts these mid-handshake with os error 10053) and
      #   pre-existing assertions assume Unix path conventions; they also walk
      #   recorder siblings that aren't checked out here.  Linux CI exercises
      #   the crate fully.
      - name: Test
        shell: bash
        run: |
          dev-exec cargo test --workspace \
            --exclude codetracer_trace_writer_nim \
            --exclude codetracer_ctfs
