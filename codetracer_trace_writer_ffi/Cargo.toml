[package]
name = "codetracer_trace_writer_ffi"
version = "0.1.0"
edition = "2024"
authors = ["Metacraft Labs Ltd"]
description = "C FFI bindings for codetracer_trace_writer, enabling Go (cgo) and other C-compatible languages to produce CodeTracer traces"
license = "MIT"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
codetracer_trace_types.workspace = true
codetracer_trace_writer.workspace = true
codetracer_trace_reader.workspace = true
codetracer_ctfs = { path = "../codetracer_ctfs" }
cbor4ii = { version = "1.0.0", features = ["serde1", "use_std"] }
num-traits = "0.2"
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cbindgen = "0.28"
